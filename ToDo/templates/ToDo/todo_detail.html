<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Details</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1 style="text-align: center;">{{ date }}</h1>
    <div style="text-align: center;">
        {%for task in tasks %}
        <center>
            {{task}} | 
            {% if task.is_completed %}
                Completed |
            {% else %}
                Not Completed |
            {% endif %} 
            <a href="{% url 'delete-task' task.todo.id task.id%}">Delete</a>
            {% if not task.is_completed %}
                <form method="post" action="{% url 'task-completion' task.id %}">
                    {% csrf_token %}

                    <button type="submit">     
                        Done
                    </button>
                </form>
            {% endif %}
        </center>
        {% endfor %}
    
    <a href="{% url 'add-task' todo.id %}"  style="display: block;">add tasks</a>
    <a href="{% url 'home' %}"  style="display: block;">Back to Home</a>
    </div>
</body>
</html>
